[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mape_k"
version = "0.0.1"
description = "Final exam for the subject Autonomic Computing"
authors = [
  { name = "Iv\u00e1n V\u00e1zquez" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "matplotlib>=3.10.9",
    "mkdocs",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pip",
    "python-dotenv",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "tqdm",
    "typer",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["mape_k"]
include = ["pyproject.toml", "mape_k/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mape_k"]
force-sort-within-sections = true

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.12",
]

